<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados - Coordinador de Mantenimiento</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/dexie.min.js"></script>
    <script src="js/jspdf.umd.min.js"></script>
    <script src="js/html2canvas.min.js"></script>
    <style>
        .resultado-card {
            background: #fff;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.08);
            margin-bottom: 24px;
        }
        .resultado-header {
            display: flex;
            align-items: center;
            gap: 20px;
            background: linear-gradient(135deg, #1a3a5c, #2563a8);
            color: #fff;
            border-radius: 10px;
            padding: 20px 28px;
            margin-bottom: 28px;
        }
        .resultado-header img { width: 90px; border-radius: 6px; background: #fff; padding: 4px; }
        .resultado-header h3 { margin: 0; font-size: 1.3rem; font-weight: 700; }
        .resultado-header p  { margin: 4px 0 0; font-size: 0.9rem; opacity: 0.85; }

        .badge-veredicto {
            font-size: 1rem;
            padding: 8px 22px;
            border-radius: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .disc-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }
        .disc-letter {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1rem;
            color: #fff;
            flex-shrink: 0;
        }
        .disc-letter.D { background: #dc3545; }
        .disc-letter.I { background: #fd7e14; }
        .disc-letter.S { background: #198754; }
        .disc-letter.C { background: #0d6efd; }

        .disc-label { width: 130px; font-size: 0.78rem; font-weight: 600; color: #555; flex-shrink: 0; }
        .disc-bar-outer {
            flex: 1;
            background: #e9ecef;
            border-radius: 6px;
            height: 22px;
            overflow: hidden;
        }
        .disc-bar-inner {
            height: 100%;
            border-radius: 6px;
            transition: width 0.6s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            color: #fff;
        }
        .disc-bar-inner.alto    { background: #198754; }
        .disc-bar-inner.medio-alto { background: #0d6efd; }
        .disc-bar-inner.medio   { background: #fd7e14; }
        .disc-bar-inner.bajo    { background: #6c757d; }

        .disc-pct { width: 42px; text-align: right; font-weight: 700; font-size: 0.9rem; color: #333; }
        .disc-nivel { width: 90px; font-size: 0.75rem; color: #777; }

        .compat-table th { background: #1a3a5c; color: #fff; font-size: 0.82rem; }
        .compat-table td { font-size: 0.85rem; vertical-align: middle; }
        .nivel-optimo    { color: #198754; font-weight: 700; }
        .nivel-adecuado  { color: #0d6efd; font-weight: 700; }
        .nivel-desarrollo { color: #fd7e14; font-weight: 700; }
        .nivel-insuficiente { color: #dc3545; font-weight: 700; }

        .mini-bar { height: 8px; border-radius: 4px; background: #e9ecef; }
        .mini-bar-fill { height: 8px; border-radius: 4px; }

        .fortalezas-card  { background: #f0fdf4; border-left: 4px solid #198754; border-radius: 8px; padding: 16px 20px; }
        .desarrollo-card  { background: #fff7ed; border-left: 4px solid #fd7e14; border-radius: 8px; padding: 16px 20px; }
        .fortalezas-card h6 { color: #198754; font-weight: 700; margin-bottom: 10px; }
        .desarrollo-card h6 { color: #e07800; font-weight: 700; margin-bottom: 10px; }
        .fortalezas-card li, .desarrollo-card li { margin-bottom: 5px; font-size: 0.88rem; }

        .perfil-box {
            background: linear-gradient(135deg, #eef2ff, #e0e7ff);
            border-radius: 10px;
            padding: 18px 24px;
            border: 1px solid #c7d2fe;
        }
        .perfil-box .perfil-nombre { font-size: 1.15rem; font-weight: 800; color: #3730a3; margin-bottom: 6px; }
        .perfil-box .perfil-desc   { font-size: 0.9rem; color: #4b5563; margin: 0; }

        .recomendacion-box {
            background: #f0f9ff;
            border: 1px solid #bae6fd;
            border-radius: 10px;
            padding: 20px 24px;
        }
        .recomendacion-box h6 { color: #0369a1; font-weight: 700; margin-bottom: 8px; }
        .recomendacion-box p  { font-size: 0.92rem; color: #1e3a5f; margin: 0; }

        .interp-item {
            border-radius: 8px;
            padding: 14px 18px;
            margin-bottom: 10px;
            border-left: 4px solid;
        }
        .interp-item.D { border-color: #dc3545; background: #fff5f5; }
        .interp-item.I { border-color: #fd7e14; background: #fffbf5; }
        .interp-item.S { border-color: #198754; background: #f0fdf4; }
        .interp-item.C { border-color: #0d6efd; background: #f0f4ff; }
        .interp-item .interp-title { font-weight: 700; font-size: 0.9rem; margin-bottom: 4px; }
        .interp-item .interp-text  { font-size: 0.85rem; color: #555; margin: 0; }

        .section-title {
            font-size: 1rem;
            font-weight: 700;
            color: #1a3a5c;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 8px;
            margin-bottom: 16px;
        }

        .datos-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 24px; margin-bottom: 4px; }
        .datos-grid .dato { font-size: 0.9rem; }
        .datos-grid .dato strong { color: #1a3a5c; }

        @media (max-width: 576px) {
            .resultado-header { flex-direction: column; text-align: center; }
            .datos-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container py-4">
        <div id="resultado-container">
            <div class="card text-center p-5">
                <div class="spinner-border text-primary mx-auto mb-3" role="status"></div>
                <p class="text-muted">Cargando resultados...</p>
            </div>
        </div>
        <div class="text-center mt-3 mb-5">
            <a href="index_mantenimiento.html" class="btn btn-outline-secondary">← Volver al Inicio</a>
        </div>
    </div>

    <div class="footer" style="text-align:center; padding:16px; color:#888; font-size:0.82rem;">
        <p>MARYTER S.A.S - Dragados Mar y Ter | Cartagena de Indias, Colombia</p>
    </div>

    <script src="js/db.js"></script>
    <script src="js/preguntas_mantenimiento.js"></script>
    <script src="js/pdf_mantenimiento.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>

    <script>
    function getInterpretacionD(p) {
        if (p >= 80) return 'Perfil con alta autoridad para liderar equipos de mantenimiento. Toma decisiones rápidas durante fallas críticas y coordina con firmeza bajo presión operativa. Ideal para gestionar paradas de planta y dirigir cuadrillas técnicas.';
        if (p >= 60) return 'Buen liderazgo en equipos de mantenimiento. Balance entre firmeza técnica y consideración del personal a cargo. Adecuado para coordinar órdenes de trabajo y gestionar prioridades.';
        if (p >= 40) return 'Enfoque moderado en liderazgo. Puede requerir apoyo para imponer disciplina técnica en el equipo de mantenimiento. Se beneficia de respaldo gerencial en situaciones de alta presión.';
        return 'Perfil que prefiere evitar confrontaciones directas con el equipo técnico. Puede mostrarse indeciso al priorizar trabajos urgentes. Requiere desarrollo en asertividad y liderazgo de equipos de planta.';
    }
    function getInterpretacionI(p) {
        if (p >= 80) return 'Excelente comunicador para coordinar con producción, proveedores y áreas internas. Capacidad para capacitar técnicos e influir positivamente en la cultura de mantenimiento. Ideal para roles que requieren negociación con contratistas.';
        if (p >= 60) return 'Buena capacidad de comunicación en entorno industrial. Se relaciona adecuadamente con proveedores y personal de otras áreas. Adecuado para realizar reuniones de planificación y reportes de gestión.';
        if (p >= 40) return 'Comunicación funcional pero no su principal fortaleza. Puede preferir el análisis técnico sobre la interacción con múltiples áreas. Se recomienda apoyarlo en presentaciones y negociaciones con proveedores.';
        return 'Perfil reservado en comunicación interpersonal. Prefiere trabajar con datos técnicos y procedimientos. Puede requerir apoyo en actividades que exijan coordinación interdepartamental y manejo de proveedores.';
    }
    function getInterpretacionS(p) {
        if (p >= 80) return 'Alta constancia y compromiso con los programas de mantenimiento. Ideal para seguimiento de planes preventivos, inspecciones recurrentes y trabajo continuo en piso de planta. Muy confiable en la ejecución de rutinas de mantenimiento.';
        if (p >= 60) return 'Buen balance entre constancia y adaptabilidad. Comprometido con los programas de mantenimiento. Adecuado para entornos que requieren tanto seguimiento de rutinas como respuesta a imprevistos.';
        if (p >= 40) return 'Estabilidad moderada. Puede mostrar impaciencia con seguimientos muy repetitivos de órdenes de trabajo. Requiere variedad de tareas para mantener su motivación en el rol de coordinación.';
        return 'Alta adaptabilidad al cambio. Prefiere diversidad de frentes de trabajo y responde bien a emergencias. Puede encontrar monótonas las rutinas de mantenimiento preventivo. Se adapta mejor a entornos dinámicos con variedad de equipos.';
    }
    function getInterpretacionC(p) {
        if (p >= 80) return 'Enfoque excepcional en cumplimiento de estándares técnicos y procedimientos de mantenimiento. Seguimiento riguroso de planes, análisis de fallas y gestión documental. Ideal para control de inventarios de repuestos, reportes de confiabilidad y cumplimiento normativo.';
        if (p >= 60) return 'Buen equilibrio entre rigor técnico y eficiencia operativa. Sigue procedimientos de mantenimiento correctamente. Adecuado para análisis de fallas, planificación de mantenimiento y gestión de documentación técnica.';
        if (p >= 40) return 'Atención a detalles técnicos funcional. Puede pasar por alto algunos requisitos de documentación de mantenimiento. Se beneficia de listas de verificación y formatos estandarizados para asegurar cumplimiento.';
        return 'Enfoque en visión general más que en detalles técnicos de mantenimiento. Puede requerir supervisión en gestión documental y análisis de fallas. Se recomienda apoyo en registros de mantenimiento y control de repuestos.';
    }

    function getRecomendaciones(analisis) {
        const recs = [];
        const p = analisis?.percentiles || {};
        const c = analisis?.compatibilidad || {};
        if (p.D < 55) recs.push('Fortalecer el liderazgo de equipos de mantenimiento y la toma de decisiones bajo presión.');
        if (p.I < 55) recs.push('Capacitación en comunicación asertiva y técnicas de coordinación con proveedores y producción.');
        if (p.S < 55) recs.push('Desarrollar constancia en seguimiento de planes de mantenimiento y órdenes de trabajo.');
        if (p.C < 55) recs.push('Fortalecer el rigor técnico, análisis de fallas y documentación de mantenimiento.');
        if ((c.conocimientoMantenimiento || 0) < 65) recs.push('Formación en técnicas de mantenimiento industrial y gestión de activos (ISO 55000).');
        if ((c.seguridadIndustrial || 0) < 65) recs.push('Entrenamiento en normativa de seguridad industrial aplicada a tareas de mantenimiento (LOTO, espacios confinados).');
        if ((c.mejoraContinua || 0) < 65) recs.push('Capacitación en Lean Manufacturing, TPM y herramientas de mejora continua.');
        if (recs.length === 0) {
            recs.push('Mantener las buenas prácticas identificadas en la evaluación conductual.');
            recs.push('Realizar seguimiento periódico del desempeño en el cargo de Coordinador de Mantenimiento.');
            recs.push('Explorar roles de mayor responsabilidad en gestión de activos y confiabilidad.');
        }
        return recs.slice(0, 6);
    }

    function mostrarResultado(resultado) {
        const container = document.getElementById('resultado-container');
        const analisis  = resultado.analisis || {};
        const percentiles = analisis.percentiles || { D: 0, I: 0, S: 0, C: 0 };
        const compatibilidad = analisis.compatibilidad || {};

        const promedioGeneral = Object.keys(compatibilidad).length > 0
            ? Object.values(compatibilidad).reduce((a, b) => a + b, 0) / Object.keys(compatibilidad).length
            : 0;

        let vClass = 'bg-secondary', vText = 'En Proceso';
        if      (promedioGeneral >= 75) { vClass = 'bg-success'; vText = 'APTO'; }
        else if (promedioGeneral >= 55) { vClass = 'bg-info text-dark'; vText = 'APTO CON DESARROLLO'; }
        else if (promedioGeneral >= 40) { vClass = 'bg-warning text-dark'; vText = 'REQUIERE EVALUACIÓN ADICIONAL'; }
        else if (promedioGeneral > 0)   { vClass = 'bg-danger'; vText = 'NO RECOMENDADO'; }

        const perfilNombre = analisis.perfil || analisis.estilo || 'N/A';
        const perfilDesc   = analisis.descripcionEstilo || analisis.estilo || '';

        const fecha = new Date(resultado.fecha).toLocaleDateString('es-CO', {
            year: 'numeric', month: 'long', day: 'numeric'
        });

        const dims = [
            { key: 'D', label: 'Dominancia',        interp: getInterpretacionD },
            { key: 'I', label: 'Influencia',         interp: getInterpretacionI },
            { key: 'S', label: 'Estabilidad',        interp: getInterpretacionS },
            { key: 'C', label: 'Conscienciosidad',   interp: getInterpretacionC },
        ];

        function nivelClase(p) {
            if (p >= 75) return 'alto';
            if (p >= 55) return 'medio-alto';
            if (p >= 40) return 'medio';
            return 'bajo';
        }
        function nivelLabel(p) {
            if (p >= 75) return 'Alto';
            if (p >= 55) return 'Medio-Alto';
            if (p >= 40) return 'Medio';
            return 'Bajo';
        }

        const reqLabels = {
            liderazgoEquipos: 'Liderazgo de equipos',
            organizacionPlanificacion: 'Organización y planificación',
            resolucionProblemas: 'Resolución de problemas bajo presión',
            comunicacionEfectiva: 'Comunicación efectiva',
            orientacionResultados: 'Orientación a resultados',
            conocimientoMantenimiento: 'Conocimiento técnico de mantenimiento',
            seguridadIndustrial: 'Seguridad industrial',
            gestionRepuestos: 'Gestión de repuestos e inventarios',
            mejoraContinua: 'Mejora continua (Lean/TPM)',
            supervisionTecnica: 'Supervisión técnica'
        };

        function evalLabel(p) {
            if (p >= 75) return ['Óptimo', 'nivel-optimo'];
            if (p >= 55) return ['Adecuado', 'nivel-adecuado'];
            if (p >= 40) return ['En Desarrollo', 'nivel-desarrollo'];
            return ['Insuficiente', 'nivel-insuficiente'];
        }

        function barColor(p) {
            if (p >= 75) return '#198754';
            if (p >= 55) return '#0d6efd';
            if (p >= 40) return '#fd7e14';
            return '#6c757d';
        }

        const recomendaciones = getRecomendaciones(analisis);

        let html = `
        <div class="resultado-card">

            <div class="resultado-header">
                <img src="Sin-titulo-1.png" alt="MARYTER" id="logo-image"
                     onerror="this.style.display='none'">
                <div>
                    <h3>DRAGADOS MAR Y TER · MARYTER S.A.S</h3>
                     <p>Informe de Evaluación Comportamental DISC<br>
                        <strong>Cargo evaluado:</strong> Coordinador de Mantenimiento y Logística</p>
                </div>
            </div>

            <div class="text-center mb-4">
                <span class="badge badge-veredicto ${vClass}">${vText}</span>
                <div class="mt-2 text-muted" style="font-size:0.82rem;">
                    Compatibilidad general con el cargo: <strong>${Math.round(promedioGeneral)}%</strong>
                </div>
            </div>

            <h6 class="section-title">Datos del Candidato</h6>
            <div class="datos-grid mb-4">
                <div class="dato"><strong>Nombre:</strong> ${resultado.nombre || 'No disponible'}</div>
                <div class="dato"><strong>Cédula:</strong> ${resultado.cedula || 'No disponible'}</div>
                <div class="dato"><strong>Correo:</strong> ${resultado.email || 'No registrado'}</div>
                <div class="dato"><strong>Fecha de evaluación:</strong> ${fecha}</div>
                <div class="dato"><strong>Cargo:</strong> Coordinador de Mantenimiento y Logística</div>
                <div class="dato"><strong>Perfil DISC:</strong> ${perfilNombre}</div>
            </div>

            <h6 class="section-title">Perfil Comportamental</h6>
            <div class="perfil-box mb-4">
                <div class="perfil-nombre">${perfilNombre}</div>
                <p class="perfil-desc">${perfilDesc || 'Perfil evaluado con base en el modelo DISC de comportamiento laboral.'}</p>
            </div>

            <h6 class="section-title">Resultados por Dimensión DISC</h6>
            <div class="mb-4">
                ${dims.map(d => {
                    const p = percentiles[d.key] || 0;
                    const cls = nivelClase(p);
                    return `
                    <div class="disc-row">
                        <div class="disc-letter ${d.key}">${d.key}</div>
                        <div class="disc-label">${d.label}</div>
                        <div class="disc-bar-outer">
                            <div class="disc-bar-inner ${cls}" style="width:${p}%">${p > 10 ? p + '%' : ''}</div>
                        </div>
                        <div class="disc-pct">${p}%</div>
                        <div class="disc-nivel">${nivelLabel(p)}</div>
                    </div>`;
                }).join('')}
            </div>

            <h6 class="section-title">Interpretación por Dimensión</h6>
            <div class="mb-4">
                ${dims.map(d => {
                    const p = percentiles[d.key] || 0;
                    return `
                    <div class="interp-item ${d.key}">
                        <div class="interp-title">${d.key} · ${d.label} — ${p}% (${nivelLabel(p)})</div>
                        <p class="interp-text">${d.interp(p)}</p>
                    </div>`;
                }).join('')}
            </div>

            <h6 class="section-title">Compatibilidad con el Cargo: Coordinador de Mantenimiento y Logística</h6>
            <div class="table-responsive mb-4">
                <table class="table table-bordered table-sm compat-table">
                    <thead>
                        <tr>
                            <th>Competencia / Requisito</th>
                            <th style="width:90px">Percentil</th>
                            <th style="width:180px">Nivel</th>
                            <th>Barra</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${Object.entries(reqLabels).map(([key, label]) => {
                            const p = compatibilidad[key] || 0;
                            const [ev, ec] = evalLabel(p);
                            return `
                            <tr>
                                <td>${label}</td>
                                <td class="text-center fw-bold">${p}%</td>
                                <td class="${ec}">${ev}</td>
                                <td>
                                    <div class="mini-bar">
                                        <div class="mini-bar-fill" style="width:${p}%;background:${barColor(p)}"></div>
                                    </div>
                                </td>
                            </tr>`;
                        }).join('')}
                        <tr class="table-dark">
                            <td><strong>Promedio General</strong></td>
                            <td class="text-center fw-bold">${Math.round(promedioGeneral)}%</td>
                            <td class="${evalLabel(promedioGeneral)[1]}">${evalLabel(promedioGeneral)[0]}</td>
                            <td>
                                <div class="mini-bar">
                                    <div class="mini-bar-fill" style="width:${Math.round(promedioGeneral)}%;background:${barColor(promedioGeneral)}"></div>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <h6 class="section-title">Análisis de Competencias</h6>
            <div class="row mb-4">
                <div class="col-md-6 mb-3">
                    <div class="fortalezas-card h-100">
                        <h6>✅ Fortalezas Identificadas</h6>
                        ${(analisis.fortalezas || []).length > 0
                            ? `<ul class="ps-3 mb-0">${analisis.fortalezas.map(f => `<li>${f}</li>`).join('')}</ul>`
                            : '<p class="text-muted mb-0" style="font-size:0.85rem">No se identificaron fortalezas destacadas con los umbrales actuales.</p>'
                        }
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                    <div class="desarrollo-card h-100">
                        <h6>🔧 Áreas de Desarrollo</h6>
                        ${(analisis.areasDesarrollo || []).length > 0
                            ? `<ul class="ps-3 mb-0">${analisis.areasDesarrollo.map(a => `<li>${a}</li>`).join('')}</ul>`
                            : '<p class="text-muted mb-0" style="font-size:0.85rem">No se identificaron áreas críticas de mejora.</p>'
                        }
                    </div>
                </div>
            </div>

            <h6 class="section-title">Recomendaciones para el Evaluador</h6>
            <div class="mb-4">
                <ol class="ps-3" style="font-size:0.9rem;">
                    ${recomendaciones.map(r => `<li class="mb-2">${r}</li>`).join('')}
                </ol>
            </div>

            <div class="recomendacion-box mb-4">
                <h6>📋 Concepto Final</h6>
                <p>${analisis.recomendacion || 'Sin recomendación disponible.'}</p>
            </div>

            <div class="text-center mt-3">
                <button class="btn btn-success btn-lg px-5" onclick="descargarPDFResultado('${resultado.cedula}')">
                    📄 Descargar Informe PDF
                </button>
            </div>`;

        if (resultado.tecnico && resultado.tecnico.analisis) {
            const ta = resultado.tecnico.analisis;
            const tVClass = ta.porcentaje >= 70 ? 'bg-success' : ta.porcentaje >= 50 ? 'bg-warning text-dark' : 'bg-danger';

            html += `
            <div style="margin-top:32px;padding-top:20px;border-top:2px solid #e5e7eb;">
                <h6 class="section-title">Resultados Evaluación Técnica de Mantenimiento</h6>
                <div class="text-center mb-4">
                    <span class="badge badge-veredicto ${tVClass}">${ta.veredicto}</span>
                    <div class="mt-2 text-muted" style="font-size:0.82rem;">
                        Puntaje: <strong>${ta.puntaje}/${ta.total}</strong> (${ta.porcentaje}%)
                    </div>
                </div>
                <div class="table-responsive mb-3">
                    <table class="table table-bordered table-sm compat-table">
                        <thead>
                            <tr>
                                <th>Categoría</th>
                                <th style="width:80px">Aciertos</th>
                                <th style="width:80px">%</th>
                                <th style="width:150px">Barra</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${Object.values(ta.categorias || {}).map(cat => {
                                const p = cat.porcentaje;
                                const barColor = p >= 70 ? '#198754' : p >= 50 ? '#fd7e14' : '#dc3545';
                                return `
                                <tr>
                                    <td>${cat.label}</td>
                                    <td class="text-center fw-bold">${cat.aciertos}/${cat.total}</td>
                                    <td class="text-center fw-bold">${p}%</td>
                                    <td>
                                        <div class="mini-bar">
                                            <div class="mini-bar-fill" style="width:${p}%;background:${barColor}"></div>
                                        </div>
                                    </td>
                                </tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
                <p style="font-size:0.9rem;color:#555;">${ta.recomendacion || ''}</p>
            </div>`;
        }

        html += `</div>`;
        container.innerHTML = html;
    }

    async function descargarPDFResultado(cedula) {
        let r = await obtenerResultados(cedula);
        if (!r) r = window.resultadoGlobal || null;
        if (!r) { alert('Resultado no encontrado'); return; }
        if (r.tecnico && r.tecnico.analisis) {
            await generarPDFCompleto(r, r.tecnico);
        } else {
            await generarPDF(r);
        }
    }

    document.addEventListener('DOMContentLoaded', async () => {
        await initDB();

        const params = new URLSearchParams(window.location.search);
        const cedula = params.get('cedula');
        const dataEncoded = params.get('data');

        if (!cedula) {
            document.getElementById('resultado-container').innerHTML =
                '<div class="alert alert-warning">No se proporcionó número de cédula. ' +
                '<a href="index_mantenimiento.html">Volver al inicio</a></div>';
            return;
        }

        if (!dataEncoded) {
            document.getElementById('resultado-container').innerHTML =
                '<div class="alert alert-danger">Acceso no autorizado. Los resultados solo están disponibles para el evaluador.</div>';
            return;
        }

        let resultado = await obtenerResultados(cedula);

        if (!resultado && dataEncoded) {
            try {
                const decoded = JSON.parse(decodeURIComponent(escape(atob(dataEncoded))));
                resultado = {
                    cedula: decoded.cedula,
                    nombre: decoded.nombre,
                    email: decoded.email || 'No registrado',
                    fecha: decoded.fecha || new Date().toISOString(),
                    analisis: decoded.analisis,
                    tecnico: decoded.tecnico,
                    completada: true
                };
                await guardarResultados(resultado).catch(() => {});
            } catch (e) {
                console.error('Error decodificando datos:', e);
            }
        }

        if (!resultado) {
            document.getElementById('resultado-container').innerHTML =
                '<div class="alert alert-danger">No se encontraron resultados para la cédula ' + cedula + '. ' +
                '<a href="index_mantenimiento.html">Volver al inicio</a></div>';
            return;
        }

        window.resultadoGlobal = resultado;
        mostrarResultado(resultado);
    });
    </script>
</body>
